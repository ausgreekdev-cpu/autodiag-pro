name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: autodiag-linux-x86_64
          - os: windows-latest
            artifact: autodiag-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Qt system libraries (build analysis + offscreen smoke test)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libvulkan1 \
            libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        shell: bash
        run: pip install -e ".[dev]"
      - name: Build
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller --noconfirm autodiag.spec
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 ./dist/autodiag
          rc=$?
          set -e
          echo "exit code: $rc"
          if [ "$rc" -ne 124 ]; then
            echo "smoke test failed: expected the app to stay alive for 8s"
            exit 1
          fi
      - name: Rename
        shell: bash
        run: mv "dist/autodiag${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
