name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: autodiag-linux-x86_64
          - os: windows-latest
            artifact: autodiag-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Qt system libraries (build analysis + offscreen smoke test)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libvulkan1 \
            libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        shell: bash
        run: pip install -e ".[dev]"
      - name: Build
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller --noconfirm autodiag.spec
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 ./dist/autodiag
          rc=$?
          set -e
          echo "exit code: $rc"
          if [ "$rc" -ne 124 ]; then
            echo "smoke test failed: expected the app to stay alive for 8s"
            exit 1
          fi
      - name: Smoke test + version resource (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\autodiag.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "smoke test failed: exe exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          $vi = (Get-Item "dist\autodiag.exe").VersionInfo
          $content = Get-Content pyproject.toml -Raw
          if ($content -notmatch 'version = "([^"]+)"') {
            Write-Error "could not read version from pyproject.toml"
            exit 1
          }
          $expected = $Matches[1]
          if ($vi.FileVersion -notlike "$expected*") {
            Write-Error "FileVersion '$($vi.FileVersion)' does not start with $expected"
            exit 1
          }
          if ($vi.ProductName -ne "AutoDiag Pro") {
            Write-Error "ProductName is '$($vi.ProductName)', expected 'AutoDiag Pro'"
            exit 1
          }
          Write-Host "FileVersion=$($vi.FileVersion) ProductName=$($vi.ProductName)"
      - name: Rename
        shell: bash
        run: mv "dist/autodiag${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # Microsoft Store package (private artifact — not attached to the public
  # release; upload the .msix to Partner Center per docs/store/STORE.md).
  # Identity comes from repo secrets once a Partner Center account exists;
  # until then the script warns and stages a placeholder identity.
  package-msix:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: pip install pillow
      - uses: actions/download-artifact@v8
        with:
          name: autodiag-windows-x86_64.exe
          path: dist
      - name: Build MSIX package
        shell: pwsh
        env:
          MSIX_PACKAGE_NAME: ${{ secrets.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ secrets.MSIX_PUBLISHER_DISPLAY }}
        run: python packaging/msix/build_msix.py --dist dist/autodiag-windows-x86_64.exe --out out --pack
      - name: Validate Store bundle
        run: python packaging/store_check.py --release-dir out --repo-root .
      - uses: actions/upload-artifact@v7
        with:
          name: autodiag-msix
          path: out/*.msix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
