[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodiag-pro"
version = "0.1.0"
description = "OBD-II scan tool — desktop diagnostics for ELM327 adapters (USB / Bluetooth SPP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pyinstaller>=6",
]

[project.scripts]
autodiag = "autodiag.__main__:main"

[tool.setuptools.packages.find]
include = ["autodiag*"]

[tool.setuptools.package-data]
autodiag = ["data/*.json", "data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
